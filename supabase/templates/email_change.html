<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Confirm your new email</title>
    </head>
    <body style="margin: 0; padding: 0; background-color: #f4f4f7">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f4f7">
            <tr>
                <td align="center" style="padding: 32px 16px">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 520px; background-color: #ffffff; border-radius: 12px">
                        <tr>
                            <td style="padding: 40px 32px; font-family: Arial, Helvetica, sans-serif; color: #1f1f29">
                                <img src="{{ .SiteURL }}/logo/logo-email.png" width="200" height="46" alt="FindPaw" style="display: block; margin: 0 0 24px; border: 0; font-size: 18px; font-weight: bold; color: #6d28d9" />
                                <h1 style="margin: 0 0 16px; font-size: 22px; line-height: 1.3">Confirm your new email</h1>
                                <p style="margin: 0 0 24px; font-size: 16px; line-height: 1.5">
                                    Click the button below to change the sign-in email of your FindPaw account from
                                    {{ .Email }} to {{ .NewEmail }}.
                                </p>
                                <table role="presentation" cellpadding="0" cellspacing="0">
                                    <tr>
                                        <td style="border-radius: 8px; background-color: #6d28d9">
                                            <a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email_change" style="display: inline-block; padding: 12px 24px; font-size: 16px; font-weight: bold; color: #ffffff; text-decoration: none">Confirm email</a>
                                        </td>
                                    </tr>
                                </table>
                                <p style="margin: 24px 0 0; font-size: 14px; line-height: 1.5; color: #6b6b80">
                                    The link expires in 1 hour. If you did not ask for this change, ignore this email and change your password.
                                </p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
